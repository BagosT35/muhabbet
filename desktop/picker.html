<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Ekran paylaş</title>
  <style>
    body { margin: 0; padding: 16px; background: #2b2d31; color: #dbdee1; font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
    h1 { margin: 0 0 12px; font-size: 16px; }
    #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
    button { display: flex; flex-direction: column; gap: 6px; padding: 8px; border: 2px solid transparent; border-radius: 8px; background: #383a40; color: inherit; font: inherit; cursor: pointer; text-align: left; }
    button:hover, button:focus-visible { border-color: #5865f2; outline: none; }
    img { width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #1e1f22; border-radius: 4px; }
    span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <h1>Ne paylaşmak istiyorsun?</h1>
  <div id="list"></div>
  <script>
    window.picker.sources().then((sources) => {
      for (const s of sources) {
        const button = document.createElement('button');
        const img = document.createElement('img');
        img.src = s.image;
        const name = document.createElement('span');
        name.textContent = s.name;
        button.title = s.name;
        button.append(img, name);
        button.addEventListener('click', () => window.picker.choose(s.id));
        document.getElementById('list').append(button);
      }
    });
    addEventListener('keydown', (e) => e.key === 'Escape' && window.close());
  </script>
</body>
</html>
